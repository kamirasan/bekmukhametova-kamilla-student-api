spring.application.name=bekmukhametova-kamilla-student-api
server.port=${SERVER_PORT:8080}

# Database settings come from environment variables (see docker-compose.yml / .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bekmukhametova_students}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

student.name=Kamilla Bekmukhametova
app.version=${APP_VERSION:1.0}
